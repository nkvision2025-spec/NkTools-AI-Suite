<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NkTools Pro - Universal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d121f; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(23, 30, 46, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1.5rem; }
        .input-box { background: #1a2235; border: 1px solid #2d3748; border-radius: 1rem; transition: all 0.3s ease; }
        .input-box:hover { border-color: #3b82f6; }
        .btn-primary { background: #2563eb; transition: all 0.2s; }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
        #settings-modal { display: none; background: rgba(0, 0, 0, 0.9); }
        .loading-spinner { border: 3px solid rgba(255, 255, 255, 0.1); border-radius: 50%; border-top: 3px solid #3b82f6; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .nav-link { cursor: pointer; transition: color 0.2s; position: relative; }
        .nav-active { color: #60a5fa; }
        .nav-active::after { content: ''; position: absolute; bottom: -8px; left: 0; width: 100%; height: 2px; background: #60a5fa; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="px-6 py-4 flex items-center justify-between border-b border-gray-800">
        <div class="flex items-center gap-2">
            <div class="bg-yellow-400 text-black p-1 rounded">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight">NkTools <span class="text-blue-500 italic">Pro</span></h1>
        </div>
        
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-400">
            <span onclick="switchTab('itp')" id="tab-itp" class="nav-link">Image to Prompt</span>
            <span onclick="switchTab('pti')" id="tab-pti" class="nav-link">Prompt to Image</span>
            <span onclick="switchTab('pc')" id="tab-pc" class="nav-link">Pro Changer</span>
            <span onclick="switchTab('av')" id="tab-av" class="nav-link nav-active">AI Video</span>
        </nav>

        <div class="flex items-center gap-4">
            <button onclick="toggleSettings()" class="p-2 hover:bg-gray-800 rounded-full text-gray-400 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="glass-card w-full max-w-4xl p-10 shadow-2xl">
            <h2 id="main-title" class="text-3xl font-bold text-blue-400 mb-2">Cinematic Motion Engine</h2>
            <p id="main-desc" class="text-gray-400 mb-10 italic">High-performance AI for region-locked keys.</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                <div class="flex flex-col gap-3">
                    <span id="label-left" class="text-xs font-bold text-blue-300 uppercase tracking-widest">Input</span>
                    <div id="drop-zone" class="input-box aspect-video flex flex-col items-center justify-center cursor-pointer relative border-dashed border-2 border-gray-700">
                        <input type="file" id="file-input" class="hidden" accept="image/*">
                        <div id="upload-placeholder" class="text-center p-4">
                            <p class="text-sm text-gray-500">Upload Image</p>
                        </div>
                        <img id="image-preview" class="hidden absolute inset-0 w-full h-full object-contain">
                    </div>
                </div>
                <div class="flex flex-col gap-3">
                    <span id="label-right" class="text-xs font-bold text-blue-300 uppercase tracking-widest">Context</span>
                    <div class="input-box aspect-video p-4">
                        <textarea id="text-input" class="w-full h-full bg-transparent border-none outline-none text-gray-200 text-sm" placeholder="Explain your motion or style..."></textarea>
                    </div>
                </div>
            </div>

            <div id="result-container" class="hidden mb-10">
                <div id="result-content" class="input-box p-6 border-green-900/40 bg-green-900/5">
                    <p id="result-text" class="text-gray-200 text-sm whitespace-pre-wrap"></p>
                </div>
            </div>

            <button id="action-btn" class="btn-primary w-full py-4 rounded-xl font-bold flex items-center justify-center gap-3">
                <span id="btn-text">GENERATE</span>
            </button>
            <div id="status-message" class="mt-4 text-center text-sm hidden"></div>
        </div>
    </main>

    <!-- Settings -->
    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="bg-[#1a2235] w-full max-w-md rounded-2xl p-6 border border-gray-700">
            <h3 class="text-xl font-bold mb-6">Repair Connection</h3>
            <div class="space-y-4">
                <input type="password" id="api-key-input" class="w-full bg-[#0d121f] border border-gray-700 rounded-lg p-3 outline-none text-white" placeholder="Gemini API Key">
                <select id="model-select" class="w-full bg-[#0d121f] border border-gray-700 rounded-lg p-3 outline-none text-white">
                    <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash (Recommended Fix)</option>
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                </select>
                <button onclick="saveSettings()" class="w-full bg-blue-600 py-3 rounded-lg font-bold">Save & Re-Connect</button>
                <button onclick="toggleSettings()" class="w-full text-gray-500 text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'av';
        const config = {
            av: { title: "Motion Engine", labelL: "Photo", labelR: "Motion", btn: "GENERATE MOTION" },
            itp: { title: "Image to Prompt", labelL: "Image", labelR: "Focus", btn: "EXTRACT PROMPT" },
            pti: { title: "Prompt to Image", labelL: "Ref", labelR: "Prompt", btn: "GENERATE IMAGE" },
            pc: { title: "Pro Changer", labelL: "Source", labelR: "Change", btn: "TRANSFORM" }
        };

        const elements = {
            mainTitle: document.getElementById('main-title'),
            actionBtn: document.getElementById('action-btn'),
            status: document.getElementById('status-message'),
            resultContainer: document.getElementById('result-container'),
            resultText: document.getElementById('result-text'),
            fileInput: document.getElementById('file-input'),
            imagePreview: document.getElementById('image-preview'),
            textInput: document.getElementById('text-input'),
            dropZone: document.getElementById('drop-zone')
        };

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }

        function saveSettings() {
            localStorage.setItem('nk_api_key', document.getElementById('api-key-input').value.trim());
            localStorage.setItem('nk_model', document.getElementById('model-select').value);
            toggleSettings();
            showStatus('Settings Updated!', 'text-green-400');
        }

        function showStatus(msg, color) {
            elements.status.innerText = msg;
            elements.status.className = `mt-4 text-center text-sm ${color}`;
            elements.status.classList.remove('hidden');
        }

        elements.dropZone.onclick = () => elements.fileInput.click();
        elements.fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (re) => {
                    elements.imagePreview.src = re.target.result;
                    elements.imagePreview.classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        async function smartRequest(payload) {
            const apiKey = localStorage.getItem('nk_api_key');
            const selectedModel = localStorage.getItem('nk_model') || 'gemini-2.0-flash-exp';
            if (!apiKey) throw new Error("API Key mangta hai! Settings mein jao.");

            // Deep Scan Fallback: Agar ek fail ho, toh doosra try karo
            const retryModels = [selectedModel, 'gemini-1.5-flash', 'gemini-2.0-flash-exp', 'gemini-1.5-pro'];
            const versions = ['v1beta', 'v1'];
            
            let lastErr = "";
            for (let model of retryModels) {
                for (let ver of versions) {
                    try {
                        const url = `https://generativelanguage.googleapis.com/${ver}/models/${model}:generateContent?key=${apiKey}`;
                        const res = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const data = await res.json();
                        if (res.ok) return data;
                        lastErr = data.error?.message || "Unknown error";
                    } catch (e) { lastErr = e.message; }
                }
            }
            throw new Error(`Sab Models Fail Ho Gaye: ${lastErr}. Kripya Settings mein Gemini 2.0 select karein.`);
        }

        elements.actionBtn.onclick = async () => {
            const apiKey = localStorage.getItem('nk_api_key');
            if(!apiKey) return toggleSettings();

            elements.actionBtn.disabled = true;
            elements.actionBtn.innerHTML = `<div class="loading-spinner"></div> Trying Multi-Region Models...`;
            
            try {
                const hasImg = !elements.imagePreview.classList.contains('hidden');
                const base64 = hasImg ? elements.imagePreview.src.split(',')[1] : null;

                const payload = {
                    contents: [{
                        parts: [
                            { text: `Task: ${config[currentTab].title}. Input context: ${elements.textInput.value}` },
                            ...(hasImg ? [{ inlineData: { mimeType: "image/png", data: base64 } }] : [])
                        ]
                    }]
                };

                const data = await smartRequest(payload);
                elements.resultText.innerText = data.candidates[0].content.parts[0].text;
                elements.resultContainer.classList.remove('hidden');
                showStatus('Success!', 'text-green-400');
            } catch (err) {
                showStatus(err.message, 'text-red-400');
            } finally {
                elements.actionBtn.disabled = false;
                elements.actionBtn.innerText = config[currentTab].btn;
            }
        };

        function switchTab(tab) {
            currentTab = tab;
            elements.mainTitle.innerText = config[tab].title;
            elements.actionBtn.innerText = config[tab].btn;
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('nav-active'));
            document.getElementById(`tab-${tab}`).classList.add('nav-active');
        }

        window.onload = () => {
            document.getElementById('api-key-input').value = localStorage.getItem('nk_api_key') || '';
            document.getElementById('model-select').value = localStorage.getItem('nk_model') || 'gemini-2.0-flash-exp';
        }
    </script>
</body>
</html>
