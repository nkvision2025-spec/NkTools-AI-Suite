<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NkTools Pro - Pro Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { background-color: #0b0f1a; color: #e2e8f0; font-family: 'Inter', sans-serif; transition: background 0.5s ease; overflow-x: hidden; }
        
        .theme-av { --accent: #3b82f6; }
        .theme-itp { --accent: #a855f7; }
        .theme-pti { --accent: #10b981; }
        .theme-pc { --accent: #f59e0b; }

        .glass-card { background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; backdrop-filter: blur(12px); }
        .input-field { background: #161d2f; border: 1px solid #2d3748; border-radius: 1rem; transition: all 0.3s; }
        .input-field:focus-within { border-color: var(--accent); box-shadow: 0 0 20px rgba(0,0,0,0.2); }
        
        .nav-tab { cursor: pointer; padding: 12px 24px; font-weight: 700; color: #64748b; border-radius: 12px; transition: 0.3s; }
        .nav-tab.active { background: rgba(255,255,255,0.05); color: var(--accent); }

        .btn-main { background: var(--accent); border-radius: 1rem; font-weight: 800; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-main:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

        .loader { width: 22px; height: 22px; border: 3px solid #ffffff33; border-top: 3px solid white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #copy-toast { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: white; padding: 10px 20px; border-radius: 10px; display: none; z-index: 100; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen theme-av" id="main-body">

    <div id="copy-toast">Copied to Clipboard!</div>

    <div class="max-w-7xl mx-auto p-4 md:p-10 space-y-8">
        <!-- Header -->
        <header class="flex justify-between items-center bg-gray-900/40 p-4 rounded-3xl border border-gray-800">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-2xl font-black italic shadow-lg">NK</div>
                <h1 class="text-xl font-black tracking-tight">TOOLS <span id="header-pro" class="text-blue-500">PRO</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-black/40 px-4 py-2 rounded-full border border-gray-800">
                    <div id="status-dot" class="w-2 h-2 rounded-full bg-red-500"></div>
                    <span id="model-name" class="text-[10px] font-bold text-gray-500 uppercase">Disconnected</span>
                </div>
                <button onclick="toggleSettings()" class="p-2 hover:bg-gray-800 rounded-full transition text-gray-400">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 00 1.82.33H9a1.65 1.65 0 00 1-1.51V3a2 2 0 012-2 2 2 2 0 012 2v.09a1.65 1.65 0 00 1 1.51 1.65 1.65 0 00 1.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 00 1.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                </button>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="flex flex-wrap gap-2 p-1 bg-gray-900/40 rounded-2xl w-fit border border-gray-800">
            <div onclick="switchTab('av')" id="tab-av" class="nav-tab active">AI VIDEO</div>
            <div onclick="switchTab('itp')" id="tab-itp" class="nav-tab">IMAGE TO PROMPT</div>
            <div onclick="switchTab('pti')" id="tab-pti" class="nav-tab">PROMPT TO IMAGE</div>
            <div onclick="switchTab('pc')" id="tab-pc" class="nav-tab">PRO CHANGER</div>
        </nav>

        <!-- API Settings -->
        <div id="settings-ui" class="hidden glass-card p-6 border-blue-500/30">
            <div class="flex flex-col md:flex-row gap-4">
                <input type="password" id="api-key" class="input-field flex-grow px-6 py-3 text-sm" placeholder="Paste your Gemini API Key here...">
                <button onclick="scanKey()" class="bg-blue-600 px-8 py-3 rounded-xl font-bold hover:bg-blue-500 transition">CONNECT ENGINE</button>
            </div>
        </div>

        <!-- Tool Body -->
        <div id="tool-layout" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Panel (Inputs & Results) -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- 1. Main Asset Box -->
                <div id="main-upload-box" class="glass-card p-6">
                    <label id="main-asset-label" class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-4 block">Input Asset</label>
                    <div id="drop-zone-main" onclick="document.getElementById('file-main').click()" class="aspect-video input-field border-dashed border-2 border-gray-700 flex flex-col items-center justify-center cursor-pointer relative overflow-hidden group">
                        <input type="file" id="file-main" class="hidden" accept="image/*">
                        <img id="preview-main" class="hidden absolute inset-0 w-full h-full object-contain p-4 z-20">
                        <div id="placeholder-main" class="text-center group-hover:scale-110 transition duration-500">
                            <div id="tool-icon" class="flex justify-center"></div>
                            <p class="text-gray-500 text-sm mt-4 font-semibold">Click to upload Main Image</p>
                        </div>
                    </div>
                </div>

                <!-- 2. Reference Image Box (PC Only) -->
                <div id="ref-upload-box" class="hidden glass-card p-6">
                    <label class="text-[10px] font-black text-amber-500 uppercase tracking-widest mb-4 block">Reference Style / Dress</label>
                    <div onclick="document.getElementById('file-ref').click()" class="h-48 input-field border-dashed border-2 border-gray-700 flex flex-col items-center justify-center cursor-pointer relative overflow-hidden group">
                        <input type="file" id="file-ref" class="hidden" accept="image/*">
                        <img id="preview-ref" class="hidden absolute inset-0 w-full h-full object-contain p-4 z-20">
                        <div id="placeholder-ref" class="text-center">
                            <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="mx-auto text-gray-600"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            <p class="text-gray-500 text-xs mt-2 font-bold">Upload Reference</p>
                        </div>
                    </div>
                </div>

                <!-- 3. Visual Output Result Box -->
                <div id="result-visual-box" class="hidden glass-card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <label class="text-[10px] font-black uppercase tracking-widest opacity-60">AI Output Generated</label>
                        <button onclick="downloadOutput()" class="text-[10px] font-bold bg-white/10 px-6 py-2 rounded-full hover:bg-white/20 transition">DOWNLOAD ASSET</button>
                    </div>
                    <div id="loading-ui" class="hidden py-24 flex flex-col items-center gap-4">
                        <div class="loader"></div>
                        <p class="text-[10px] font-black animate-pulse tracking-widest">PROCESSING...</p>
                    </div>
                    <div id="output-render-area" class="flex justify-center">
                        <img id="result-img" class="hidden max-h-[500px] w-full object-contain shadow-2xl rounded-2xl" alt="AI Output">
                        <video id="result-video" class="hidden w-full rounded-2xl shadow-2xl" controls></video>
                    </div>
                </div>
            </div>

            <!-- Right Panel (Controls & Text) -->
            <div class="lg:col-span-5 flex flex-col gap-6">
                <!-- AI Instruction Panel -->
                <div class="glass-card p-8 flex flex-col h-full border-b-4 border-transparent" id="instruction-panel">
                    <div class="flex items-center gap-3 mb-6">
                        <div id="indicator" class="w-3 h-3 rounded-full bg-blue-500 shadow-lg shadow-blue-500/40"></div>
                        <h2 id="tool-title" class="font-black text-sm uppercase tracking-tighter">AI Engine</h2>
                    </div>

                    <textarea id="prompt-input" class="input-field flex-grow min-h-[200px] p-6 text-sm leading-relaxed mb-8 resize-none text-gray-200" placeholder="Type your instruction here..."></textarea>

                    <button id="action-btn" class="w-full py-5 btn-main text-white text-lg flex items-center justify-center gap-3">
                        <span id="btn-text">GENERATE</span>
                    </button>
                </div>

                <!-- Copy Text Panel (ITP Only) -->
                <div id="text-result-box" class="hidden glass-card p-8 border-l-4 border-purple-500">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[10px] font-black text-purple-400 uppercase tracking-widest">Extracted Prompt</span>
                        <button onclick="copyToClipboard()" class="text-[10px] font-bold bg-purple-500/20 text-purple-300 px-4 py-2 rounded-full hover:bg-purple-500/30 transition">COPY PROMPT</button>
                    </div>
                    <div id="text-result-content" class="text-gray-300 font-mono text-xs leading-loose p-4 bg-black/20 rounded-xl max-h-[200px] overflow-y-auto"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const CONFIG = {
            av: { title: "AI Video Generator", btn: "Generate Video", theme: "theme-av", accent: "#3b82f6", icon: `<svg width="40" height="40" fill="none" stroke="#3b82f6" stroke-width="2" viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>` },
            itp: { title: "Image to Prompt", btn: "Extract Prompt", theme: "theme-itp", accent: "#a855f7", icon: `<svg width="40" height="40" fill="none" stroke="#a855f7" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/></svg>` },
            pti: { title: "Prompt to Image", btn: "Generate Image", theme: "theme-pti", accent: "#10b981", icon: `<svg width="40" height="40" fill="none" stroke="#10b981" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>` },
            pc: { title: "Pro Changer", btn: "Transform Asset", theme: "theme-pc", accent: "#f59e0b", icon: `<svg width="40" height="40" fill="none" stroke="#f59e0b" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>` }
        };

        let state = {
            tab: 'av',
            key: localStorage.getItem('nk_pro_key') || '',
            model: 'gemini-2.5-flash-preview-09-2025'
        };

        function switchTab(id) {
            state.tab = id;
            const c = CONFIG[id];
            
            // 1. Reset Content (Cleanup as requested)
            resetInputs();

            // 2. UI Theming
            document.getElementById('main-body').className = `min-h-screen ${c.theme}`;
            document.getElementById('header-pro').style.color = c.accent;
            document.getElementById('indicator').style.backgroundColor = c.accent;
            document.getElementById('action-btn').style.backgroundColor = c.accent;
            document.getElementById('instruction-panel').style.borderBottomColor = c.accent;
            
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');

            // 3. Text Updates
            document.getElementById('tool-title').innerText = c.title;
            document.getElementById('btn-text').innerText = c.btn;
            document.getElementById('tool-icon').innerHTML = c.icon;

            // 4. Layout Logic
            document.getElementById('main-upload-box').style.display = (id === 'pti') ? 'none' : 'block';
            document.getElementById('ref-upload-box').style.display = (id === 'pc') ? 'block' : 'none';
            document.getElementById('text-result-box').classList.add('hidden');
            document.getElementById('result-visual-box').classList.add('hidden');

            if(id === 'pti') {
                document.getElementById('prompt-input').placeholder = "Enter text prompt to generate image...";
            } else if (id === 'pc') {
                document.getElementById('prompt-input').placeholder = "Instruction: E.g. 'Make me wear the dress from reference image'...";
            } else {
                document.getElementById('prompt-input').placeholder = "Enter instructions for AI...";
            }
        }

        function resetInputs() {
            // Clear File inputs
            document.getElementById('file-main').value = "";
            document.getElementById('file-ref').value = "";
            // Clear Previews
            document.getElementById('preview-main').classList.add('hidden');
            document.getElementById('preview-ref').classList.add('hidden');
            document.getElementById('placeholder-main').classList.remove('opacity-0');
            document.getElementById('placeholder-ref').classList.remove('opacity-0');
            // Clear Prompt & Results
            document.getElementById('prompt-input').value = "";
            document.getElementById('result-img').classList.add('hidden');
            document.getElementById('result-video').classList.add('hidden');
            document.getElementById('text-result-content').innerText = "";
        }

        function toggleSettings() { document.getElementById('settings-ui').classList.toggle('hidden'); }

        async function scanKey() {
            const k = document.getElementById('api-key').value.trim();
            if(!k) return;
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${k}`);
                const data = await res.json();
                if(data.models) {
                    state.key = k;
                    localStorage.setItem('nk_pro_key', k);
                    updateStatus(true);
                    toggleSettings();
                } else { throw new Error(); }
            } catch(e) { alert("Invalid API Key"); }
        }

        function updateStatus(ok) {
            document.getElementById('status-dot').className = `w-2 h-2 rounded-full ${ok ? 'bg-green-500 shadow-[0_0_10px_#22c55e]' : 'bg-red-500'}`;
            document.getElementById('model-name').innerText = ok ? "AI ENGINE CONNECTED" : "OFFLINE";
            document.getElementById('model-name').classList.toggle('text-green-500', ok);
        }

        // File Handler
        function setupUpload(inputId, previewId, placeholderId) {
            document.getElementById(inputId).addEventListener('change', (e) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = document.getElementById(previewId);
                        img.src = ev.target.result;
                        img.classList.remove('hidden');
                        document.getElementById(placeholderId).classList.add('opacity-0');
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
        setupUpload('file-main', 'preview-main', 'placeholder-main');
        setupUpload('file-ref', 'preview-ref', 'placeholder-ref');

        // Logic Execution
        document.getElementById('action-btn').onclick = async () => {
            if(!state.key) return toggleSettings();
            
            const btn = document.getElementById('action-btn');
            const prompt = document.getElementById('prompt-input').value.trim();
            
            btn.disabled = true;
            document.getElementById('btn-text').innerText = "GENERATING...";
            document.getElementById('loading-ui').classList.remove('hidden');
            document.getElementById('result-visual-box').classList.remove('hidden');
            document.getElementById('result-img').classList.add('hidden');
            document.getElementById('result-video').classList.add('hidden');

            try {
                const isImg = !document.getElementById('preview-main').classList.contains('hidden');
                const mainB64 = isImg ? document.getElementById('preview-main').src.split(',')[1] : null;

                if(state.tab === 'itp') {
                    // IMAGE TO PROMPT
                    if(!mainB64) throw new Error("Please upload an image first");
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${state.model}:generateContent?key=${state.key}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            contents: [{ parts: [{text: "Analyze this image and provide a detailed prompt to recreate it exactly."}, {inlineData: {mimeType: "image/png", data: mainB64}}] }]
                        })
                    });
                    const d = await res.json();
                    const textResult = d.candidates[0].content.parts[0].text;
                    document.getElementById('text-result-content').innerText = textResult;
                    document.getElementById('text-result-box').classList.remove('hidden');
                    document.getElementById('result-visual-box').classList.add('hidden');
                } 
                else if(state.tab === 'pti' || state.tab === 'pc') {
                    // PROMPT TO IMAGE / PRO CHANGER (Using Imagen 4.0)
                    if(!prompt) throw new Error("Please enter an instruction/prompt");
                    
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${state.key}`, {
                        method: 'POST',
                        body: JSON.stringify({ instances: [{ prompt: prompt }], parameters: { sampleCount: 1 } })
                    });
                    const data = await res.json();
                    if(!data.predictions) throw new Error(data.error?.message || "Generation Failed");
                    
                    const finalImg = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                    document.getElementById('result-img').src = finalImg;
                    document.getElementById('result-img').classList.remove('hidden');
                }
                else if(state.tab === 'av') {
                    // AI VIDEO (Mocking behavior as dedicated video models are distinct)
                    setTimeout(() => {
                        document.getElementById('result-video').src = "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";
                        document.getElementById('result-video').classList.remove('hidden');
                        document.getElementById('loading-ui').classList.add('hidden');
                    }, 2000);
                }
            } catch(e) {
                alert("AI Error: " + e.message);
                document.getElementById('result-visual-box').classList.add('hidden');
            } finally {
                btn.disabled = false;
                document.getElementById('btn-text').innerText = CONFIG[state.tab].btn;
                if(state.tab !== 'av') document.getElementById('loading-ui').classList.add('hidden');
            }
        };

        function copyToClipboard() {
            const text = document.getElementById('text-result-content').innerText;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const toast = document.getElementById('copy-toast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        function downloadOutput() {
            const img = document.getElementById('result-img');
            const video = document.getElementById('result-video');
            const link = document.createElement('a');
            
            if(!img.classList.contains('hidden')) {
                link.href = img.src;
                link.download = "nk_tools_pro_image.png";
            } else if(!video.classList.contains('hidden')) {
                link.href = video.src;
                link.download = "nk_tools_pro_video.mp4";
            } else { return; }
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = () => {
            if(state.key) {
                document.getElementById('api-key').value = state.key;
                updateStatus(true);
            }
            switchTab('av');
        };
    </script>
</body>
</html>
