<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NkTools Pro - Custom Layouts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { background-color: #0b0f1a; color: #e2e8f0; font-family: 'Inter', sans-serif; transition: background 0.5s ease; }
        
        .theme-av { --accent: #3b82f6; }
        .theme-itp { --accent: #a855f7; }
        .theme-pti { --accent: #10b981; }
        .theme-pc { --accent: #f59e0b; }

        .glass-card { background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; backdrop-filter: blur(12px); }
        .input-field { background: #161d2f; border: 1px solid #2d3748; border-radius: 1rem; transition: all 0.3s; }
        .input-field:focus-within { border-color: var(--accent); box-shadow: 0 0 20px rgba(0,0,0,0.2); }
        
        .nav-tab { cursor: pointer; padding: 12px 24px; font-weight: 700; color: #64748b; border-radius: 12px; transition: 0.3s; }
        .nav-tab.active { background: rgba(255,255,255,0.05); color: var(--accent); }

        .btn-main { background: var(--accent); border-radius: 1rem; font-weight: 800; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-main:hover { filter: brightness(1.2); transform: translateY(-2px); }

        .loader { width: 22px; height: 22px; border: 3px solid #ffffff33; border-top: 3px solid white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #image-result-display { border-radius: 1rem; max-height: 400px; width: 100%; object-fit: contain; background: #000; }
    </style>
</head>
<body class="min-h-screen theme-av" id="main-body">

    <div class="max-w-7xl mx-auto p-4 md:p-10 space-y-8">
        <!-- Header -->
        <header class="flex justify-between items-center bg-gray-900/40 p-4 rounded-3xl border border-gray-800">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-2xl font-black italic shadow-lg">NK</div>
                <h1 class="text-xl font-black tracking-tight">TOOLS <span id="header-pro" class="text-blue-500">PRO</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-black/40 px-4 py-2 rounded-full border border-gray-800">
                    <div id="status-dot" class="w-2 h-2 rounded-full bg-red-500"></div>
                    <span id="model-name" class="text-[10px] font-bold text-gray-500">OFFLINE</span>
                </div>
                <button onclick="toggleSettings()" class="p-2 hover:bg-gray-800 rounded-full transition">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </button>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="flex flex-wrap gap-2 p-1 bg-gray-900/40 rounded-2xl w-fit border border-gray-800">
            <div onclick="switchTab('av')" id="tab-av" class="nav-tab active">MOTION</div>
            <div onclick="switchTab('itp')" id="tab-itp" class="nav-tab">IMG TO PROMPT</div>
            <div onclick="switchTab('pti')" id="tab-pti" class="nav-tab">PROMPT TO IMG</div>
            <div onclick="switchTab('pc')" id="tab-pc" class="nav-tab">PRO CHANGER</div>
        </nav>

        <!-- Settings -->
        <div id="settings-ui" class="hidden glass-card p-6 border-blue-500/30">
            <div class="flex flex-col md:flex-row gap-4">
                <input type="password" id="api-key" class="input-field flex-grow px-6" placeholder="Paste Gemini API Key...">
                <button onclick="scanKey()" class="bg-blue-600 px-8 py-3 rounded-xl font-bold">CONNECT ENGINE</button>
            </div>
        </div>

        <!-- Tool Container (Dynamic Layout) -->
        <div id="tool-layout" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Panel -->
            <div id="left-panel" class="lg:col-span-7 space-y-6">
                <!-- Image Upload Section (Hidden in PTI initially) -->
                <div id="upload-container" class="glass-card p-6">
                    <label id="asset-label" class="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] mb-4 block">Input Asset</label>
                    <div id="drop-zone" class="aspect-video input-field border-dashed border-2 border-gray-700 flex flex-col items-center justify-center cursor-pointer relative overflow-hidden group">
                        <input type="file" id="file-input" class="hidden" accept="image/*">
                        <img id="preview-img" class="hidden absolute inset-0 w-full h-full object-contain p-4 z-20">
                        <div id="upload-placeholder" class="text-center group-hover:scale-110 transition duration-500">
                            <div id="tool-icon"></div>
                            <p class="text-gray-500 text-sm mt-4 font-semibold">Select or Drop Image</p>
                        </div>
                    </div>
                </div>

                <!-- Generated Image Display (Used for PTI) -->
                <div id="pti-result-container" class="hidden glass-card p-6 text-center">
                    <label class="text-[10px] font-black text-green-500 uppercase tracking-[0.2em] mb-4 block">Generated Visual</label>
                    <div id="image-loading-ui" class="hidden py-20 flex flex-col items-center gap-4">
                        <div class="loader !w-10 !h-10 !border-green-500 !border-t-transparent"></div>
                        <p class="text-xs font-bold text-green-500 animate-pulse">CREATING MASTERPIECE...</p>
                    </div>
                    <img id="image-result-display" class="hidden mx-auto shadow-2xl" alt="AI Generated">
                </div>
            </div>

            <!-- Right Panel -->
            <div id="right-panel" class="lg:col-span-5 flex flex-col gap-6">
                <div class="glass-card p-8 flex flex-col h-full">
                    <div class="flex items-center gap-3 mb-6">
                        <div id="indicator" class="w-3 h-3 rounded-full bg-blue-500 shadow-lg"></div>
                        <h2 id="tool-title" class="font-black text-sm uppercase tracking-tighter">Engine</h2>
                    </div>

                    <textarea id="prompt-input" class="input-field flex-grow min-h-[200px] p-6 text-sm leading-relaxed mb-8 resize-none" placeholder="Enter instructions..."></textarea>

                    <button id="action-btn" class="w-full py-5 btn-main text-white text-lg flex items-center justify-center gap-3">
                        <span id="btn-text">GENERATE</span>
                    </button>
                </div>
            </div>

        </div>

        <!-- Result Console (For Text Responses) -->
        <div id="text-result-box" class="hidden glass-card p-8 border-l-4 border-blue-500">
            <div class="flex justify-between items-center mb-6">
                <span class="text-[10px] font-black text-blue-400 uppercase tracking-widest">Analysis Result</span>
                <button onclick="copyData()" class="text-[10px] font-bold bg-white/5 px-4 py-2 rounded-full hover:bg-white/10">COPY DATA</button>
            </div>
            <div id="text-result-content" class="text-gray-300 font-mono text-sm leading-loose"></div>
        </div>

    </div>

    <script>
        const CONFIG = {
            av: { title: "Motion Engine", btn: "Generate Motion", theme: "theme-av", accent: "#3b82f6", layout: "itp", icon: `<svg width="48" height="48" fill="none" stroke="#3b82f6" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>` },
            itp: { title: "Prompt Extractor", btn: "Analyze Image", theme: "theme-itp", accent: "#a855f7", layout: "itp", icon: `<svg width="48" height="48" fill="none" stroke="#a855f7" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/></svg>` },
            pti: { title: "Prompt to Image", btn: "Generate Image", theme: "theme-pti", accent: "#10b981", layout: "pti", icon: `<svg width="48" height="48" fill="none" stroke="#10b981" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>` },
            pc: { title: "Pro Changer", btn: "Transform Asset", theme: "theme-pc", accent: "#f59e0b", layout: "itp", icon: `<svg width="48" height="48" fill="none" stroke="#f59e0b" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>` }
        };

        const state = { tab: 'av', key: localStorage.getItem('nk_key'), model: localStorage.getItem('nk_model') };

        function switchTab(id) {
            state.tab = id;
            const c = CONFIG[id];
            
            // Themes
            document.getElementById('main-body').className = `min-h-screen ${c.theme}`;
            document.getElementById('header-pro').style.color = c.accent;
            document.getElementById('indicator').style.backgroundColor = c.accent;
            document.getElementById('action-btn').style.backgroundColor = c.accent;
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');

            // Text & Icons
            document.getElementById('tool-title').innerText = c.title;
            document.getElementById('btn-text').innerText = c.btn;
            document.getElementById('tool-icon').innerHTML = c.icon;

            // Layout Logic (PTI Special Handling)
            if(c.layout === 'pti') {
                // Swap panels if needed (Desktop only)
                document.getElementById('upload-container').classList.add('hidden');
                document.getElementById('pti-result-container').classList.remove('hidden');
                document.getElementById('text-result-box').classList.add('hidden');
                document.getElementById('prompt-input').placeholder = "Describe the image you want to create...";
            } else {
                document.getElementById('upload-container').classList.remove('hidden');
                document.getElementById('pti-result-container').classList.add('hidden');
                document.getElementById('prompt-input').placeholder = "Enter instructions for the AI...";
            }
        }

        function toggleSettings() { document.getElementById('settings-ui').classList.toggle('hidden'); }

        async function scanKey() {
            const k = document.getElementById('api-key').value.trim();
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${k}`);
                const d = await res.json();
                const m = d.models.find(x => x.name.includes('flash') && x.supportedGenerationMethods.includes('generateContent'));
                if(m) {
                    state.key = k; state.model = m.name;
                    localStorage.setItem('nk_key', k); localStorage.setItem('nk_model', m.name);
                    updateStatus(true); toggleSettings();
                }
            } catch(e) { alert("Invalid Key"); }
        }

        function updateStatus(ok) {
            document.getElementById('status-dot').className = `w-2 h-2 rounded-full ${ok ? 'bg-green-500' : 'bg-red-500 animate-pulse'}`;
            document.getElementById('model-name').innerText = ok ? state.model.split('/')[1].toUpperCase() : "OFFLINE";
        }

        // File Selection
        document.getElementById('drop-zone').onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = (e) => {
            const f = e.target.files[0];
            if(f) {
                const r = new FileReader();
                r.onload = (ev) => {
                    document.getElementById('preview-img').src = ev.target.result;
                    document.getElementById('preview-img').classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('opacity-0');
                };
                r.readAsDataURL(f);
            }
        };

        // Execution
        document.getElementById('action-btn').onclick = async () => {
            if(!state.key) return toggleSettings();
            
            const btn = document.getElementById('action-btn');
            btn.disabled = true;
            document.getElementById('btn-text').innerText = "WORKING...";

            try {
                const isImg = !document.getElementById('preview-img').classList.contains('hidden');
                const base64 = isImg ? document.getElementById('preview-img').src.split(',')[1] : null;

                // Handle Image Generation (Imagen 4.0)
                if(state.tab === 'pti') {
                    document.getElementById('image-loading-ui').classList.remove('hidden');
                    document.getElementById('image-result-display').classList.add('hidden');
                    
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${state.key}`, {
                        method: 'POST',
                        body: JSON.stringify({ instances: { prompt: document.getElementById('prompt-input').value }, parameters: { sampleCount: 1 } })
                    });
                    const data = await res.json();
                    const imgUrl = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                    document.getElementById('image-result-display').src = imgUrl;
                    document.getElementById('image-result-display').classList.remove('hidden');
                    document.getElementById('image-loading-ui').classList.add('hidden');
                } else {
                    // Handle Text Generation (Gemini)
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${state.model}:generateContent?key=${state.key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `Mode: ${state.tab}. Prompt: ${document.getElementById('prompt-input').value}` }, ...(isImg ? [{ inlineData: { mimeType: "image/png", data: base64 } }] : [])] }] })
                    });
                    const d = await res.json();
                    document.getElementById('text-result-content').innerText = d.candidates[0].content.parts[0].text;
                    document.getElementById('text-result-box').classList.remove('hidden');
                }
            } catch(e) {
                alert("Error: " + e.message);
            } finally {
                btn.disabled = false;
                document.getElementById('btn-text').innerText = CONFIG[state.tab].btn;
            }
        };

        window.onload = () => {
            if(state.key) {
                document.getElementById('api-key').value = state.key;
                updateStatus(true);
            }
            switchTab('av');
        };
    </script>
</body>
</html>
