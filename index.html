<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NkTools Pro - Universal Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f1a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-glow { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5); }
        .input-field { background: #161d2f; border: 1px solid #2d3748; border-radius: 0.75rem; transition: border 0.3s; }
        .input-field:focus-within { border-color: #3b82f6; }
        #settings-panel { display: none; background: rgba(0,0,0,0.85); }
        .loader { width: 20px; height: 20px; border: 3px solid #ffffff33; border-top: 3px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="p-5 flex justify-between items-center border-b border-gray-800 glass sticky top-0 z-40">
        <div class="flex items-center gap-2">
            <span class="text-2xl font-black italic text-blue-500">NK</span>
            <span class="text-xl font-bold">Tools Pro</span>
        </div>
        <div class="flex gap-4">
            <button onclick="openSettings()" class="p-2 bg-gray-800 rounded-lg hover:bg-gray-700 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-10 flex flex-col items-center">
        <div class="w-full max-w-5xl glass p-8 rounded-3xl shadow-2xl">
            <h1 class="text-3xl font-bold text-center mb-2">Cinematic Motion Engine</h1>
            <p class="text-gray-400 text-center mb-10">AI processing with Auto-Region detection.</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Left: Upload -->
                <div class="space-y-4">
                    <label class="text-sm font-semibold text-blue-400 uppercase tracking-wider">Input Photo</label>
                    <div id="drop-area" class="input-field aspect-video flex flex-col items-center justify-center cursor-pointer border-dashed border-2 border-gray-700 relative overflow-hidden">
                        <input type="file" id="img-input" class="hidden" accept="image/*">
                        <div id="upload-txt" class="text-center">
                            <svg class="mx-auto mb-2 text-gray-500" width="40" height="40" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                            <p class="text-gray-500">Tap to upload image</p>
                        </div>
                        <img id="preview-img" class="hidden absolute inset-0 w-full h-full object-cover">
                    </div>
                </div>

                <!-- Right: Prompt -->
                <div class="space-y-4">
                    <label class="text-sm font-semibold text-blue-400 uppercase tracking-wider">Motion Description</label>
                    <div class="input-field aspect-video p-4">
                        <textarea id="prompt-txt" class="w-full h-full bg-transparent border-none outline-none resize-none text-gray-200" placeholder="Describe how you want it to move... (e.g. dramatic zoom, hair blowing in wind)"></textarea>
                    </div>
                </div>
            </div>

            <!-- Result Area -->
            <div id="result-box" class="hidden mt-10 p-6 rounded-2xl bg-blue-900/10 border border-blue-500/20">
                <h3 class="text-blue-400 font-bold mb-2">AI Response:</h3>
                <p id="output-data" class="text-gray-200 whitespace-pre-wrap leading-relaxed"></p>
            </div>

            <button id="gen-btn" class="w-full mt-10 py-5 rounded-2xl btn-glow font-bold text-lg flex items-center justify-center gap-3">
                <span>GENERATE MOTION</span>
            </button>
            
            <p id="status-log" class="text-center mt-4 text-sm text-gray-500"></p>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-panel" class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="bg-[#1a1f2e] w-full max-w-md rounded-3xl p-8 border border-gray-700 shadow-2xl">
            <h2 class="text-2xl font-bold mb-6">Connection Settings</h2>
            <div class="space-y-5">
                <div>
                    <label class="block text-xs text-gray-400 mb-2 uppercase">Your API Key</label>
                    <input type="password" id="key-field" class="w-full bg-[#0b0f1a] border border-gray-700 rounded-xl p-4 outline-none focus:border-blue-500" placeholder="Paste Gemini Key here...">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-2 uppercase">Preferred Model (Auto-Fallback enabled)</label>
                    <select id="model-field" class="w-full bg-[#0b0f1a] border border-gray-700 rounded-xl p-4 outline-none">
                        <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash (Recommended)</option>
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                        <option value="gemini-1.0-pro">Gemini 1.0 Pro (Legacy Fix)</option>
                    </select>
                </div>
                <div class="pt-4 space-y-3">
                    <button onclick="saveSettings()" class="w-full py-4 bg-blue-600 rounded-xl font-bold hover:bg-blue-500">Save Configuration</button>
                    <button onclick="closeSettings()" class="w-full text-gray-500 hover:text-white transition">Back to App</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DOM = {
            dropArea: document.getElementById('drop-area'),
            imgInput: document.getElementById('img-input'),
            preview: document.getElementById('preview-img'),
            uploadTxt: document.getElementById('upload-txt'),
            prompt: document.getElementById('prompt-txt'),
            genBtn: document.getElementById('gen-btn'),
            output: document.getElementById('output-data'),
            resultBox: document.getElementById('result-box'),
            status: document.getElementById('status-log'),
            keyInput: document.getElementById('key-field'),
            modelSelect: document.getElementById('model-field'),
            settings: document.getElementById('settings-panel')
        };

        function openSettings() { DOM.settings.style.display = 'flex'; }
        function closeSettings() { DOM.settings.style.display = 'none'; }

        function saveSettings() {
            localStorage.setItem('nk_key', DOM.keyInput.value.trim());
            localStorage.setItem('nk_model', DOM.modelSelect.value);
            closeSettings();
            updateStatus('Settings saved!', 'text-green-400');
        }

        function updateStatus(msg, color = 'text-gray-500') {
            DOM.status.innerText = msg;
            DOM.status.className = `text-center mt-4 text-sm ${color}`;
        }

        // Image Handling
        DOM.dropArea.onclick = () => DOM.imgInput.click();
        DOM.imgInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (re) => {
                    DOM.preview.src = re.target.result;
                    DOM.preview.classList.remove('hidden');
                    DOM.uploadTxt.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        // THE ULTIMATE FALLBACK ENGINE
        async function fetchAI(payload) {
            const key = localStorage.getItem('nk_key');
            if (!key) throw new Error("API Key nahi mili! Settings icon par click karke key dalein.");

            const selected = localStorage.getItem('nk_model') || 'gemini-2.0-flash-exp';
            
            // List of all possible models and versions to try
            const modelsToTry = [
                selected,
                'gemini-2.0-flash-exp',
                'gemini-1.5-flash',
                'gemini-1.5-flash-8b',
                'gemini-1.5-pro',
                'gemini-1.0-pro'
            ];
            
            const apiVersions = ['v1beta', 'v1'];
            let lastErrorMessage = "";

            for (let model of modelsToTry) {
                for (let ver of apiVersions) {
                    try {
                        updateStatus(`Connecting to ${model} (${ver})...`, 'text-blue-400');
                        
                        const response = await fetch(`https://generativelanguage.googleapis.com/${ver}/models/${model}:generateContent?key=${key}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        const result = await response.json();

                        if (response.ok && result.candidates) {
                            return result.candidates[0].content.parts[0].text;
                        } else {
                            lastErrorMessage = result.error?.message || "Response error";
                            console.log(`Failed: ${model} on ${ver}`);
                        }
                    } catch (e) {
                        lastErrorMessage = e.message;
                    }
                }
            }
            throw new Error(`Sab Models Fail: ${lastErrorMessage}. Check if your key is active!`);
        }

        DOM.genBtn.onclick = async () => {
            if (!localStorage.getItem('nk_key')) return openSettings();

            DOM.genBtn.disabled = true;
            DOM.genBtn.innerHTML = `<div class="loader"></div> SCANNING REGION...`;
            DOM.resultBox.classList.add('hidden');
            updateStatus('Starting deep scan...', 'text-blue-400');

            try {
                const isImg = !DOM.preview.classList.contains('hidden');
                const base64 = isImg ? DOM.preview.src.split(',')[1] : null;

                const payload = {
                    contents: [{
                        parts: [
                            { text: `System: Provide cinematic motion settings. User Prompt: ${DOM.prompt.value}` },
                            ...(isImg ? [{ inlineData: { mimeType: "image/png", data: base64 } }] : [])
                        ]
                    }]
                };

                const text = await fetchAI(payload);
                DOM.output.innerText = text;
                DOM.resultBox.classList.remove('hidden');
                updateStatus('Generation Successful!', 'text-green-400');
            } catch (err) {
                updateStatus(err.message, 'text-red-400');
            } finally {
                DOM.genBtn.disabled = false;
                DOM.genBtn.innerText = 'GENERATE MOTION';
            }
        };

        window.onload = () => {
            DOM.keyInput.value = localStorage.getItem('nk_key') || '';
            DOM.modelSelect.value = localStorage.getItem('nk_model') || 'gemini-2.0-flash-exp';
        };
    </script>
</body>
</html>
