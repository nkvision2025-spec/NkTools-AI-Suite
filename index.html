<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NkTools Pro - Ultimate Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass-card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; transition: all 0.3s ease; }
        .glass-card:hover { border-color: #58a6ff; }
        .input-dark { background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 10px; width: 100%; outline: none; font-size: 0.9rem; }
        .btn-primary { background-color: #1f6feb; color: white; font-weight: 700; border-radius: 10px; transition: 0.3s; }
        .btn-primary:hover { background-color: #388bfd; transform: translateY(-1px); }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #58a6ff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tab-active { color: #58a6ff; border-bottom: 2px solid #58a6ff; }
        .nav-item { cursor: pointer; transition: 0.2s; white-space: nowrap; padding-bottom: 8px; font-weight: 600; font-size: 0.85rem; }
        .nav-item:hover { color: #58a6ff; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <div class="w-full max-w-6xl p-4 md:p-8 space-y-6">
        <!-- Modern Header -->
        <header class="flex flex-col md:flex-row justify-between items-center gap-6 border-b border-gray-800 pb-6">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center font-black italic text-2xl shadow-lg shadow-blue-900/20">NK</div>
                <div>
                    <h1 class="text-2xl font-black tracking-tighter">TOOLS <span class="text-blue-500">PRO</span></h1>
                    <p class="text-gray-500 text-xs uppercase tracking-widest">Universal AI Studio</p>
                </div>
            </div>

            <div class="flex items-center gap-4 bg-gray-900/50 p-2 rounded-2xl border border-gray-800">
                <div id="connection-status" class="flex items-center gap-2 px-3 border-r border-gray-800">
                    <div id="status-dot" class="w-2 h-2 rounded-full bg-red-500"></div>
                    <span id="active-model-display" class="text-[10px] font-mono text-gray-400">OFFLINE</span>
                </div>
                <button onclick="toggleSettings()" class="p-2 text-gray-400 hover:text-white transition">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </button>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="flex gap-8 border-b border-gray-800 overflow-x-auto no-scrollbar">
            <span onclick="switchTab('av')" id="nav-av" class="nav-item tab-active">MOTION ENGINE</span>
            <span onclick="switchTab('itp')" id="nav-itp" class="nav-item text-gray-500">IMAGE TO PROMPT</span>
            <span onclick="switchTab('pti')" id="nav-pti" class="nav-item text-gray-500">PROMPT TO IMAGE</span>
            <span onclick="switchTab('pc')" id="nav-pc" class="nav-item text-gray-500">PRO CHANGER</span>
        </nav>

        <!-- Settings Drawer -->
        <div id="settings-drawer" class="hidden glass-card p-6 bg-blue-900/5 border-blue-500/30">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-blue-400">SYSTEM CORE SETTINGS</h3>
                <button onclick="toggleSettings()" class="text-gray-500 hover:text-white">&times;</button>
            </div>
            <div class="flex flex-col md:flex-row gap-4">
                <input type="password" id="api-key-input" class="input-dark flex-grow" placeholder="Enter Gemini API Key...">
                <button onclick="scanAndSave()" class="btn-primary px-6 py-2 text-sm flex items-center gap-2">
                    <span id="scan-btn-txt">INITIALIZE KEY</span>
                </button>
            </div>
            <div id="scan-log" class="mt-3 text-[10px] uppercase font-bold text-gray-600"></div>
        </div>

        <!-- Dynamic Content Area -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Workspace Left: Inputs -->
            <div class="lg:col-span-7 space-y-6">
                <div class="glass-card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <label id="input-label-file" class="text-xs font-bold text-gray-500 uppercase tracking-widest">Base Asset</label>
                        <span id="tool-badge" class="bg-blue-900/30 text-blue-400 text-[10px] px-2 py-1 rounded-md font-bold">MODE: MOTION</span>
                    </div>
                    
                    <div id="drop-area" class="h-80 border-2 border-dashed border-gray-800 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:bg-gray-800/30 transition relative overflow-hidden group">
                        <input type="file" id="file-input" class="hidden" accept="image/*">
                        <img id="preview-img" class="hidden absolute inset-0 w-full h-full object-contain p-4 z-10">
                        <div id="upload-ui" class="text-center z-0">
                            <svg class="mx-auto mb-4 text-gray-700 group-hover:text-blue-500 transition" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            <p class="text-gray-500 text-sm">Drop file or click to browse</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Workspace Right: Logic -->
            <div class="lg:col-span-5 space-y-6">
                <div class="glass-card p-6 flex flex-col h-full">
                    <label id="input-label-text" class="text-xs font-bold text-gray-500 uppercase tracking-widest block mb-4">Instructions / Prompt</label>
                    <textarea id="prompt-input" class="input-dark flex-grow min-h-[150px] resize-none leading-relaxed text-sm mb-6" placeholder="Describe what you want to achieve..."></textarea>
                    
                    <button id="main-action-btn" class="w-full py-4 btn-primary flex items-center justify-center gap-3 shadow-xl shadow-blue-900/10">
                        <span id="btn-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></span>
                        <span id="btn-text">GENERATE MOTION</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Result Console -->
        <div id="result-box" class="hidden glass-card p-6 overflow-hidden border-green-900/20 bg-green-900/5">
            <div class="flex justify-between items-center mb-4">
                <span class="text-green-500 font-bold text-xs tracking-widest">AI OUTPUT DATA</span>
                <button onclick="copyResult()" class="text-[10px] text-gray-500 hover:text-white uppercase font-bold">Copy to Clipboard</button>
            </div>
            <div id="result-content" class="text-gray-200 text-sm whitespace-pre-wrap font-mono leading-relaxed"></div>
        </div>

        <footer class="text-center py-10 opacity-30 text-[10px] font-bold tracking-[0.3em] uppercase">
            NkTools Professional &copy; 2024 • Multi-Model Engine v4.0
        </footer>
    </div>

    <script>
        const CONFIG = {
            av: { title: "MOTION ENGINE", btn: "GENERATE MOTION", desc: "Base Photo", prompt: "Motion Description" },
            itp: { title: "IMAGE TO PROMPT", btn: "EXTRACT PROMPT", desc: "Target Image", prompt: "Extraction Focus" },
            pti: { title: "PROMPT TO IMAGE", btn: "GENERATE IMAGE", desc: "Reference (Opt)", prompt: "Detailed Image Prompt" },
            pc: { title: "PRO CHANGER", btn: "TRANSFORM ASSET", desc: "Source Asset", prompt: "Modification Rules" }
        };

        const state = {
            tab: 'av',
            key: localStorage.getItem('nk_pro_key') || '',
            model: localStorage.getItem('nk_active_model') || '',
            isLoading: false
        };

        const DOM = {
            apiKey: document.getElementById('api-key-input'),
            settings: document.getElementById('settings-drawer'),
            log: document.getElementById('scan-log'),
            modelDisplay: document.getElementById('active-model-display'),
            indicator: document.getElementById('status-dot'),
            navItems: document.querySelectorAll('.nav-item'),
            toolBadge: document.getElementById('tool-badge'),
            btnText: document.getElementById('btn-text'),
            fileInput: document.getElementById('file-input'),
            previewImg: document.getElementById('preview-img'),
            uploadUI: document.getElementById('upload-ui'),
            dropArea: document.getElementById('drop-area'),
            promptInput: document.getElementById('prompt-input'),
            actionBtn: document.getElementById('main-action-btn'),
            resultBox: document.getElementById('result-box'),
            resultContent: document.getElementById('result-content'),
            inputLabelFile: document.getElementById('input-label-file'),
            inputLabelText: document.getElementById('input-label-text')
        };

        function toggleSettings() { DOM.settings.classList.toggle('hidden'); }

        function switchTab(tabId) {
            state.tab = tabId;
            // Update UI
            DOM.navItems.forEach(item => {
                item.classList.remove('tab-active');
                item.classList.add('text-gray-500');
            });
            document.getElementById(`nav-${tabId}`).classList.add('tab-active');
            document.getElementById(`nav-${tabId}`).classList.remove('text-gray-500');

            // Update Tool Config
            const conf = CONFIG[tabId];
            DOM.toolBadge.innerText = `MODE: ${conf.title}`;
            DOM.btnText.innerText = conf.btn;
            DOM.inputLabelFile.innerText = conf.desc;
            DOM.inputLabelText.innerText = conf.prompt;
            DOM.resultBox.classList.add('hidden');
        }

        async function scanAndSave() {
            const key = DOM.apiKey.value.trim();
            if (!key) return alert("Please enter a key!");

            DOM.log.innerText = "Scanning available models...";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await res.json();

                if (!res.ok) throw new Error(data.error?.message || "Auth Failed");

                const bestModel = data.models.find(m => 
                    m.supportedGenerationMethods.includes("generateContent") && 
                    (m.name.includes("flash") || m.name.includes("pro"))
                );

                if (bestModel) {
                    state.key = key;
                    state.model = bestModel.name;
                    localStorage.setItem('nk_pro_key', key);
                    localStorage.setItem('nk_active_model', state.model);
                    
                    updateStatusUI(true, state.model);
                    DOM.log.innerHTML = `<span class="text-green-500">CONNECTED: ${state.model}</span>`;
                    setTimeout(toggleSettings, 1000);
                } else {
                    throw new Error("No compatible models found for this key.");
                }
            } catch (err) {
                DOM.log.innerHTML = `<span class="text-red-500">ERROR: ${err.message}</span>`;
                updateStatusUI(false, "OFFLINE");
            }
        }

        function updateStatusUI(ok, name) {
            DOM.modelDisplay.innerText = name.replace('models/', '').toUpperCase();
            DOM.indicator.className = `w-2 h-2 rounded-full ${ok ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]' : 'bg-red-500 animate-pulse'}`;
        }

        // Image Handling
        DOM.dropArea.onclick = () => DOM.fileInput.click();
        DOM.fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (re) => {
                    DOM.previewImg.src = re.target.result;
                    DOM.previewImg.classList.remove('hidden');
                    DOM.uploadUI.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        // Execution Logic
        DOM.actionBtn.onclick = async () => {
            if (!state.key || !state.model) {
                toggleSettings();
                return;
            }

            state.isLoading = true;
            DOM.actionBtn.disabled = true;
            DOM.actionBtn.innerHTML = `<div class="loader"></div> PROCESSING...`;
            DOM.resultBox.classList.add('hidden');

            try {
                const hasImg = !DOM.previewImg.classList.contains('hidden');
                const base64 = hasImg ? DOM.previewImg.src.split(',')[1] : null;

                const payload = {
                    contents: [{
                        parts: [
                            { text: `Tool: ${CONFIG[state.tab].title}. Task: ${DOM.promptInput.value}` },
                            ...(hasImg ? [{ inlineData: { mimeType: "image/png", data: base64 } }] : [])
                        ]
                    }]
                };

                const url = `https://generativelanguage.googleapis.com/v1beta/${state.model}:generateContent?key=${state.key}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error?.message || "AI Call Failed");

                DOM.resultContent.innerText = data.candidates[0].content.parts[0].text;
                DOM.resultBox.classList.remove('hidden');
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                state.isLoading = false;
                DOM.actionBtn.disabled = false;
                DOM.actionBtn.innerHTML = `<span id="btn-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></span><span>${CONFIG[state.tab].btn}</span>`;
            }
        };

        function copyResult() {
            const el = document.createElement('textarea');
            el.value = DOM.resultContent.innerText;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("Copied!");
        }

        window.onload = () => {
            if (state.key && state.model) {
                DOM.apiKey.value = state.key;
                updateStatusUI(true, state.model);
            } else {
                toggleSettings();
            }
        };
    </script>
</body>
</html>
