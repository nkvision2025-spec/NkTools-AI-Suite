<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NkTools Pro - Repair Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .accent-border { border-left: 4px solid #238636; }
        .input-dark { background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 8px; width: 100%; outline: none; }
        .input-dark:focus { border-color: #58a6ff; }
        .btn-green { background-color: #238636; color: white; font-weight: 600; transition: 0.2s; }
        .btn-green:hover { background-color: #2ea043; }
        .btn-blue { background-color: #1f6feb; color: white; font-weight: 600; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-10 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-4xl space-y-6">
        <!-- Header -->
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span class="text-blue-500">NK</span> Tools <span class="bg-blue-900 text-blue-200 text-xs px-2 py-1 rounded">REPAIR MODE</span>
            </h1>
            <button onclick="document.getElementById('setup-box').classList.toggle('hidden')" class="text-sm text-gray-400 underline">Key Settings</button>
        </div>

        <!-- Setup Box (Visible by Default if no key) -->
        <div id="setup-box" class="card p-6 accent-border">
            <h2 class="text-lg font-semibold mb-4">API Configuration (Critical)</h2>
            <div class="space-y-4">
                <input type="password" id="api-key" class="input-dark" placeholder="Paste Gemini API Key here...">
                <div class="flex flex-col md:flex-row gap-3">
                    <button onclick="testKey()" class="flex-1 p-3 bg-gray-800 rounded-lg hover:bg-gray-700 font-medium">Test API Connection</button>
                    <button onclick="saveKey()" class="flex-1 p-3 btn-green rounded-lg">Save & Initialize</button>
                </div>
                <p id="test-status" class="text-xs text-gray-500"></p>
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="card p-6 space-y-4">
                <label class="text-xs font-bold uppercase text-gray-500">Input Image</label>
                <div onclick="document.getElementById('file-upload').click()" class="h-48 border-2 border-dashed border-gray-700 rounded-xl flex items-center justify-center cursor-pointer hover:bg-gray-800/50 relative overflow-hidden">
                    <input type="file" id="file-upload" class="hidden" accept="image/*">
                    <img id="img-preview" class="hidden absolute inset-0 w-full h-full object-contain">
                    <div id="placeholder-ui" class="text-center">
                        <p class="text-sm">Click to select photo</p>
                    </div>
                </div>
            </div>

            <div class="card p-6 space-y-4">
                <label class="text-xs font-bold uppercase text-gray-500">Motion Prompt</label>
                <textarea id="prompt-area" class="input-dark h-48 resize-none" placeholder="Describe the cinematic movement..."></textarea>
            </div>
        </div>

        <!-- Action Button -->
        <button id="run-btn" class="w-full p-4 btn-blue rounded-xl text-lg flex items-center justify-center gap-3">
            <span>GENERATE CINEMATIC DATA</span>
        </button>

        <!-- Result -->
        <div id="result-area" class="hidden card p-6 border-l-4 border-blue-500 bg-blue-900/5">
            <h3 class="text-blue-400 font-bold mb-3">AI Engine Output:</h3>
            <div id="output-text" class="text-gray-300 whitespace-pre-wrap leading-relaxed"></div>
        </div>

        <p id="system-log" class="text-center text-sm text-gray-600 italic"></p>
    </div>

    <script>
        const UI = {
            key: document.getElementById('api-key'),
            testStatus: document.getElementById('test-status'),
            file: document.getElementById('file-upload'),
            preview: document.getElementById('img-preview'),
            placeholder: document.getElementById('placeholder-ui'),
            prompt: document.getElementById('prompt-area'),
            runBtn: document.getElementById('run-btn'),
            result: document.getElementById('result-area'),
            output: document.getElementById('output-text'),
            log: document.getElementById('system-log')
        };

        // Initialize from storage
        window.onload = () => {
            UI.key.value = localStorage.getItem('nk_repair_key') || '';
            if (UI.key.value) document.getElementById('setup-box').classList.add('hidden');
        };

        function saveKey() {
            localStorage.setItem('nk_repair_key', UI.key.value.trim());
            document.getElementById('setup-box').classList.add('hidden');
            UI.log.innerText = "Key saved. System ready.";
        }

        async function testKey() {
            const key = UI.key.value.trim();
            if (!key) return alert("Key toh daalo bhai!");
            
            UI.testStatus.innerText = "Testing... (Requesting Model List)";
            try {
                // Check if key can even list models
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await res.json();
                
                if (res.ok) {
                    UI.testStatus.innerHTML = `<span class="text-green-500">✔ Key is ACTIVE. System detects ${data.models.length} models available.</span>`;
                } else {
                    UI.testStatus.innerHTML = `<span class="text-red-500">✘ Key REJECTED: ${data.error.message}</span>`;
                }
            } catch (e) {
                UI.testStatus.innerText = "Connection failed. Internet check karein.";
            }
        }

        UI.file.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (re) => {
                    UI.preview.src = re.target.result;
                    UI.preview.classList.remove('hidden');
                    UI.placeholder.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        async function safeCall(payload) {
            const key = localStorage.getItem('nk_repair_key');
            // Hum specifically "gemini-1.5-flash" use karenge kyunki ye sabse zyada stable hai
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
            
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.message || "Server Error");
            return data.candidates[0].content.parts[0].text;
        }

        UI.runBtn.onclick = async () => {
            const key = localStorage.getItem('nk_repair_key');
            if (!key) return document.getElementById('setup-box').classList.remove('hidden');

            UI.runBtn.disabled = true;
            UI.runBtn.innerHTML = `<div class="loader"></div> PROCESSING...`;
            UI.result.classList.add('hidden');

            try {
                const isImg = !UI.preview.classList.contains('hidden');
                const base64 = isImg ? UI.preview.src.split(',')[1] : null;

                const payload = {
                    contents: [{
                        parts: [
                            { text: `Task: Cinematic Motion Engine. User Instruction: ${UI.prompt.value}` },
                            ...(isImg ? [{ inlineData: { mimeType: "image/png", data: base64 } }] : [])
                        ]
                    }]
                };

                const text = await safeCall(payload);
                UI.output.innerText = text;
                UI.result.classList.remove('hidden');
                UI.log.innerText = "Task Complete.";
            } catch (err) {
                UI.log.innerHTML = `<span class="text-red-500">CRITICAL ERROR: ${err.message}</span>`;
                // If it fails, suggest re-testing the key
                document.getElementById('setup-box').classList.remove('hidden');
            } finally {
                UI.runBtn.disabled = false;
                UI.runBtn.innerText = "GENERATE CINEMATIC DATA";
            }
        };
    </script>
</body>
</html>
